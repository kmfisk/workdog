modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/kmfisk/workdog/issues"

[[mods]]
    modId="${mod_id}"
    version="${minecraft_version}-${mod_version}"
    displayName="${mod_name}"
    #updateJSONURL=""
    displayURL="https://github.com/kmfisk/workdog/wiki"
    logoFile="icon.png"
    #credits=""
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
